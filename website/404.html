<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found · AttackGraph</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('ag-theme')||'light'); })();</script>
</head>
<body>
  <div class="error-page">
    <div class="error-num">404</div>
    <div class="rule" style="max-width:200px;margin:.5rem auto 1.5rem"><span class="rule-diamond">◆</span></div>
    <h2 style="margin-bottom:0.75rem;font-style:italic">Page not found</h2>
    <p style="font-style:italic;margin-bottom:2rem;max-width:400px">This endpoint doesn't exist — or it was undocumented and AttackGraph would have flagged it.</p>
    <a href="/" class="btn btn-primary">Return home</a>
  </div>
</body>
</html>
