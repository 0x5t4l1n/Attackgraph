[project]
name = "attackgraph"
version = "1.0.0"
description = "Intelligent web application attack-path mapping platform"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
