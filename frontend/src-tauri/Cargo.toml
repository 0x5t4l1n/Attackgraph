[package]
name = "attackgraph"
version = "1.0.0"
description = "AttackGraph — Intelligent Web Application Attack-Path Mapper"
authors = ["Nexulean"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "attackgraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
